name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install osquery (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          export OSQUERY_KEY=1484120AC4E9F8A1A577AEEE97A80C63C9D8B80B
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://pkg.osquery.io/deb/pubkey.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/osquery.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/osquery.gpg] https://pkg.osquery.io/deb deb main" | sudo tee /etc/apt/sources.list.d/osquery.list
          sudo apt-get update
          sudo apt-get install -y osquery
          osqueryi --version

      - name: Install osquery (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask osquery
          osqueryi --version

      - name: Install frontend dependencies & build Web Cockpit
        run: |
          cd web
          npm install
          npx tsc --noEmit
          npm run build

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests with race detector
        run: go test -v -race ./...

      - name: Build go-aida binary
        run: go build -o bin/go-aida .
