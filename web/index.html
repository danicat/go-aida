<html lang="en" data-theme="dark" class="a2ui-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="/assets/idle.png" />
    <title>AIDA // CYBER-DIAGNOSTIC COCKPIT v2.0</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('aida_theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.remove('a2ui-dark', 'a2ui-light');
          document.documentElement.classList.add('a2ui-' + theme);
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? 'light dark' : 'dark light');
        } catch (_) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
  </head>
  <body>
    <aida-cockpit></aida-cockpit>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
